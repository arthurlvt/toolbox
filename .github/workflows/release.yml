# Release automatique : à chaque tag « v… » (ex. git tag v2.1 && git push origin v2.1),
# GitHub compile Toolbox (universelle : Apple Silicon + Intel), lance les tests,
# fabrique le .dmg et l'attache à la release (créée si besoin, avec les notes générées).
# Aussi lançable à la main (onglet Actions → Release → Run workflow) : le .dmg est alors un artefact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version d'après le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist

      - name: Compiler (universelle) et tester
        run: TOOLBOX_UNIVERSAL=1 TOOLBOX_STRICT=1 bash build.sh --no-install

      - name: Fabriquer le .dmg
        run: bash make-dmg.sh

      - name: Garder le .dmg (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-dmg
          path: build/*.dmg

      - name: Attacher à la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Toolbox ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" build/*.dmg --clobber
